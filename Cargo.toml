[package]
name = "cacert-scan"
version = "0.1.0"
edition = "2021"

[dependencies]
aho-corasick = "1.0.0"
base64 = "0.23.0"
flate2 = "1.1.0"
hex = "0.4.0"
memchr = "2.7.0"
openssl = "0.10.72"
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1.0.0"
sha2 = "0.11.0"
tar = "0.4.45"
x509-parser = "0.18.0"
xz2 = "0.1.0"
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.14.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
