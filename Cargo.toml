[package]
name = "cacert-scan"
version = "0.1.0"
edition = "2021"

[dependencies]
aho-corasick = "1"
memchr = "2"
base64 = "0.22"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
x509-parser = "0.16"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openssl = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
